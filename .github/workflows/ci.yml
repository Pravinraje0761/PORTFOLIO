name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pravin-raj-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pravin-raj-portfolio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
